<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#244a8a">
  <title>Cube Solver</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="bar">
  <h1><button id="menu" aria-label="Puzzles"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><g stroke="rgba(0,0,0,.4)" stroke-width="1"><rect x=".5" y=".5" width="7" height="7" fill="#f4f4f0"/><rect x="8.5" y=".5" width="7" height="7" fill="#2563eb"/><rect x="16.5" y=".5" width="7" height="7" fill="#ff8a1f"/><rect x=".5" y="8.5" width="7" height="7" fill="#27a844"/><rect x="8.5" y="8.5" width="7" height="7" fill="#ffd400"/><rect x="16.5" y="8.5" width="7" height="7" fill="#d7263d"/><rect x=".5" y="16.5" width="7" height="7" fill="#ff8a1f"/><rect x="8.5" y="16.5" width="7" height="7" fill="#f4f4f0"/><rect x="16.5" y="16.5" width="7" height="7" fill="#27a844"/></g></svg><div class="ht"><b id="ttl">Cube Solver</b><small id="sub">Twisty puzzles, solved step by step</small></div><button id="d3" aria-label="Switch between flat and 3D view">3D</button></h1>
</header>
<div id="hud"><div id="cap"></div><div id="snack" role="status"></div></div>
<main id="stage">
  <canvas id="cv"></canvas>
</main>
<section id="panel">
  <div id="pc">
    <div id="pal"></div>
    <div class="row"><button class="btn" id="rnd"><span class="pi"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></span>Random</button><button class="btn" id="rst"><span class="pi"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Solved</button></div>
    <div class="row"><button class="fill" id="solve"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Solve</button><button class="fill alt recbtn" id="rec"><i class="dot"></i>Record</button></div>
  </div>
  <div id="vc" hidden>
    <div id="moves"></div>
    <div class="row" id="play-row">
      <button class="ib" id="rep" aria-label="Restart"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg></button>
      <button class="ib" id="prev" aria-label="Previous move"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="ib big" id="play" aria-label="Play or pause"></button>
      <button class="ib" id="next" aria-label="Next move"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
    <div class="row"><button class="btn" id="edit"><span class="pi"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></span>Edit</button><button class="btn recbtn" id="rec2" style="gap:8px"><i class="dot"></i>Record</button></div>
    <div id="spd"><span>Speed</span><input type="range" id="sp" min="0.5" max="4" step="0.25" value="1.5"><span id="spv">1.5×</span></div>
  </div>
</section>
<div id="scrim"><div id="dlg" role="dialog" aria-modal="true"><h2 id="dt"></h2><p id="dm"></p><video id="pv" controls playsinline hidden></video><div class="act"><button id="sv" hidden>Download</button><button id="ok">OK</button></div></div></div>
<div id="rq"><div class="rqb" role="dialog" aria-modal="true"><h2>Record solve</h2><p>Choose where to film it.</p>
<button class="rqo" data-m="here"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10.5l5-3v9l-5-3z"/></svg></i><span><b>Record here</b><small>Orbiting camera on a studio backdrop</small></span></button>
<button class="rqo" data-m="studio"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M4 10l8-6 8 6M6 10v11M18 10v11M10 21v-6h4v6"/></svg></i><span><b>Open studio</b><small>Puzzle floating over a table in a styled room</small></span></button>
<div class="act"><button id="rqx">Cancel</button></div></div></div>
<div id="studio" hidden><canvas id="sc"></canvas>
<div class="sbar" id="sbar"><button class="sbtn" id="sx" aria-label="Close studio"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="ht"><b>Studio</b><small>Puzzle floating over the table</small></div></div>
<div class="sfoot"><div id="sopt" hidden><b>Place</b><div class="chips" id="cp"></div><b>Lighting</b><div class="chips" id="cl"></div></div>
<div class="srow"><button class="fill alt" id="scus" style="flex:.9"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Customize</button><button class="fill recbtn" id="srec" style="flex:1.1"><i class="dot"></i>Record</button></div></div></div>
<div id="navscrim"></div>
<nav id="nav" aria-label="Puzzles"><div class="nh"><svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><g stroke="rgba(0,0,0,.4)" stroke-width="1"><rect x=".5" y=".5" width="7" height="7" fill="#f4f4f0"/><rect x="8.5" y=".5" width="7" height="7" fill="#2563eb"/><rect x="16.5" y=".5" width="7" height="7" fill="#ff8a1f"/><rect x=".5" y="8.5" width="7" height="7" fill="#27a844"/><rect x="8.5" y="8.5" width="7" height="7" fill="#ffd400"/><rect x="16.5" y="8.5" width="7" height="7" fill="#d7263d"/><rect x=".5" y="16.5" width="7" height="7" fill="#ff8a1f"/><rect x="8.5" y="16.5" width="7" height="7" fill="#f4f4f0"/><rect x="16.5" y="16.5" width="7" height="7" fill="#27a844"/></g></svg><div><b>Cube Solver</b><small>Twisty puzzles, solved step by step</small></div></div></nav>
<div id="szrow"><span>Size</span><input type="range" id="sz" min="2" max="25" step="1" value="3" aria-label="Cube size"><span id="szv">3×3×3</span></div>

  <!-- External libraries used by the 3D renderer and 3x3 cube solver. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cubejs@1.3.2/lib/cube.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cubejs@1.3.2/lib/solve.js"></script>

  <!-- App scripts are classic scripts and must stay in this dependency order. -->
  <script src="js/core.js"></script>
  <script src="js/view.js"></script>
  <script src="js/playback.js"></script>
  <script src="js/studio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
